<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Aura Wellness Platform</title>
    <link rel="stylesheet" href="aura_style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #fdfbf7 0%, #e2e8f0 100%);
        }
        .login-card {
            background: white;
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(15, 23, 42, 0.05);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 30px 0;
        }
        .btn-social {
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .btn-social:hover {
            background: #f8fafc;
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #94a3b8;
            font-size: 0.8rem;
            margin: 25px 0;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary);
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            font-size: 1rem;
        }
        .login-footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #64748b;
        }
        .login-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card reveal">
            <div class="logo" style="justify-content: center; margin-bottom: 30px;">
                <div class="logo-icon"></div>
                <span style="font-size: 1.8rem;">AURA</span>
            </div>
            <h2>Welcome Back</h2>
            <p style="color: #64748b; margin-top: 8px;">Continue your journey to wellbeing</p>

            <div class="social-login">
                <button class="btn-social"><i class="fab fa-google"></i> Google</button>
                <button class="btn-social"><i class="fab fa-apple"></i> Apple</button>
            </div>

            <div class="divider">OR LOGIN WITH EMAIL</div>

            <form>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@company.com">
                </div>
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label style="margin-bottom: 0;">Password</label>
                        <a href="#" style="font-size: 0.8rem; color: var(--accent); text-decoration: none; font-weight: 600;">Forgot?</a>
                    </div>
                    <input type="password" placeholder="••••••••">
                </div>
                <a href="index.html" class="btn-primary" style="width: 100%; display: block; border: none; cursor: pointer; margin-top: 10px; text-decoration: none;">Sign In</a>
            </form>

            <div class="login-footer">
                Don't have an account? <a href="#">Create Account</a>
            </div>
            
            <a href="index.html" style="display: inline-block; margin-top: 40px; color: #94a3b8; text-decoration: none; font-size: 0.85rem;">
                <i class="fas fa-arrow-left"></i> Back to Homepage
            </a>
        </div>
    </div>

    <script>
        document.querySelector('.reveal').classList.add('active');
    </script>
</body>
</html>
